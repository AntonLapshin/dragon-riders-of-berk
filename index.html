<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dragon Riders of Berk — A Barbaric Archipelago Board Game</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel-decorative/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/nunito/900.css">
<style>
:root{
  --gold:#f0b429; --gold-2:#ffd766; --ink:#0b1220; --panel:#141d33; --panel-2:#1a2440;
  --line:rgba(240,180,41,.28); --text:#e8eefc; --muted:#9fb0d0;
  --p0:#39d98a; --p1:#ffb020;
}
*{box-sizing:border-box; margin:0; padding:0;
  scrollbar-width:thin; scrollbar-color:rgba(240,180,41,.55) rgba(255,255,255,.06)}
/* ---------- beautiful scrollbars ---------- */
::-webkit-scrollbar{width:11px; height:11px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05); border-radius:8px}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#ffd766,#c77f16);
  border-radius:8px; border:2px solid transparent; background-clip:padding-box;
  box-shadow:0 0 6px rgba(240,180,41,.35);
}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffe9a8,#f0b429); background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--text);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(47,109,246,.16), transparent 60%),
    radial-gradient(1000px 700px at 90% 0%, rgba(240,180,41,.10), transparent 55%),
    radial-gradient(900px 900px at 50% 110%, rgba(32,184,174,.12), transparent 60%),
    #0b1220;
  overflow-x:hidden;
}
/* ---------- header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:14px 22px 10px; max-width:1500px; margin:0 auto;
}
h1{
  font-family:'Cinzel Decorative',serif; font-size:clamp(20px,3vw,32px); letter-spacing:1px;
  background:linear-gradient(180deg,#ffe9a8,#f0b429 55%,#c77f16);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 2px 18px rgba(240,180,41,.25);
}
.sub{color:var(--muted); font-size:13px; margin-top:2px}
.top-btns{display:flex; gap:8px; flex-wrap:wrap}
/* ---------- buttons ---------- */
.btn{
  font-family:inherit; font-weight:900; border:none; border-radius:12px; cursor:pointer;
  padding:10px 16px; font-size:14px; letter-spacing:.4px; color:var(--text);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),#e8a020); color:#3a2405;
  box-shadow:0 4px 0 #a86e12, 0 8px 22px rgba(232,160,32,.35);}
.btn.gold:not(:disabled):hover{transform:translateY(-2px); filter:brightness(1.06)}
.btn.gold:not(:disabled):active{transform:translateY(2px); box-shadow:0 1px 0 #a86e12}
.btn.blue{background:linear-gradient(180deg,#5a9bff,#2f6df6); color:#fff;
  box-shadow:0 4px 0 #1c4bb0, 0 8px 22px rgba(47,109,246,.4)}
.btn.blue:not(:disabled):hover{transform:translateY(-2px); filter:brightness(1.08)}
.btn.blue:not(:disabled):active{transform:translateY(2px); box-shadow:0 1px 0 #1c4bb0}
.btn.big{width:100%; padding:12px 16px; font-size:15px; border-radius:14px}
.btn small{display:block; font-size:11px; font-weight:800; opacity:.72; margin-top:3px; letter-spacing:.3px}
.btn.ghost{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16)}
.btn.ghost:hover{background:rgba(255,255,255,.13)}
/* ---------- layout ---------- */
.layout{
  display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:16px;
  padding:4px 18px 26px; max-width:1500px; margin:0 auto; align-items:start;
}
@media (max-width:1024px){ .layout{grid-template-columns:1fr} }
/* ---------- board (tall square: aspect 1.0 — cells never overlap) ---------- */
.board-zone{min-width:0}
.board{
  position:relative; aspect-ratio:1; container-type:inline-size;
  border:10px solid #5b3d22; outline:2px solid rgba(240,180,41,.35); border-radius:20px;
  overflow:hidden; background:#0e2231;
  box-shadow:inset 0 0 70px rgba(0,0,0,.6), 0 22px 60px rgba(0,0,0,.55);
}
.board-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.78) saturate(.92)}
.board::after{content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(4,8,16,.55));}
.path-svg{position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none}
.path-svg polyline{fill:none; stroke:rgba(255,214,110,.55); stroke-width:5; stroke-dasharray:16 12;
  stroke-linejoin:round; stroke-linecap:round; filter:drop-shadow(0 0 6px rgba(255,214,110,.35))}
/* tiles */
.tile{
  position:absolute; z-index:2; width:6.4cqw; height:6.4cqw; border-radius:50%;
  transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.28), rgba(10,16,30,.86) 62%);
  border:.3cqw solid var(--tc,#8fa3c8);
  box-shadow:0 .45cqw 1.3cqw rgba(0,0,0,.55), 0 0 1.1cqw color-mix(in srgb, var(--tc) 45%, transparent);
  cursor:default;
}
.tile .ticon{font-size:2.8cqw; line-height:1; filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.6))}
.tile .tnum{position:absolute; bottom:-1.7cqw; left:50%; transform:translateX(-50%);
  font-size:1.3cqw; font-weight:900; color:rgba(255,255,255,.5)}
.tile.nest{padding:.45cqw}
.tile.nest img{width:100%; height:100%; border-radius:50%; object-fit:cover}
.tile.nest .negg{position:absolute; right:-.65cqw; bottom:-.65cqw; font-size:1.8cqw;
  background:#101828; border:.2cqw solid var(--tc); border-radius:50%; width:2.8cqw; height:2.8cqw;
  display:flex; align-items:center; justify-content:center}
.tile.start{--tc:var(--gold)}
.tile.start .tlabel{position:absolute; top:108%; left:50%; transform:translateX(-50%);
  font-family:'Cinzel Decorative',serif; font-size:1.7cqw; color:var(--gold-2); white-space:nowrap;
  text-shadow:0 .2cqw .6cqw #000}
.tile.hit{animation:tilehit .9s ease}
@keyframes tilehit{0%{box-shadow:0 0 0 0 rgba(255,214,110,.9)}100%{box-shadow:0 0 0 3cqw rgba(255,214,110,0)}}
/* lair */
.lair{
  position:absolute; z-index:2; width:12.8cqw; height:9cqw; transform:translate(-50%,-50%);
  border-radius:1.4cqw; overflow:hidden; border:.35cqw solid #9fdcff;
  box-shadow:0 0 2.6cqw rgba(120,210,255,.5), 0 .8cqw 2cqw rgba(0,0,0,.6);
  animation:lairpulse 3s ease-in-out infinite;
}
.lair img{width:100%; height:100%; object-fit:cover}
.lair span{
  position:absolute; left:0; right:0; bottom:0; text-align:center; font-family:'Cinzel Decorative',serif;
  font-size:1.35cqw; letter-spacing:.1cqw; color:#eaf7ff; padding:.4cqw 0 .5cqw;
  background:linear-gradient(0deg, rgba(6,14,26,.92), transparent);
}
@keyframes lairpulse{0%,100%{box-shadow:0 0 1.8cqw rgba(120,210,255,.35)}50%{box-shadow:0 0 3.6cqw rgba(120,210,255,.75)}}
/* tokens */
.token{position:absolute; z-index:6; width:4.9cqw; height:4.9cqw; transition:left .23s linear, top .23s linear}
.token .tin{
  width:100%; height:100%; border-radius:50%; overflow:hidden; border:.38cqw solid var(--pc);
  box-shadow:0 0 1.2cqw var(--pc), 0 .5cqw 1cqw rgba(0,0,0,.6); animation:bob 2.3s ease-in-out infinite;
  background:#0b1220;
}
.token .tin img{width:100%; height:100%; object-fit:cover}
.token .tname{
  position:absolute; top:-1.9cqw; left:50%; transform:translateX(-50%); font-size:1.35cqw; font-weight:900;
  color:var(--pc); text-shadow:0 .15cqw .4cqw #000; white-space:nowrap;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5cqw)}}
/* legend */
.legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px; justify-content:center}
.chip{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:700}
.chip i{width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid var(--tc);
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.3), rgba(10,16,30,.9))}
/* ---------- side panel ---------- */
.side{display:flex; flex-direction:column; gap:14px; min-width:0}
.card{
  background:linear-gradient(165deg, var(--panel-2), var(--panel));
  border:1px solid var(--line); border-radius:16px; padding:14px 16px;
  box-shadow:0 12px 34px rgba(0,0,0,.4);
}
.card-title{font-family:'Cinzel Decorative',serif; font-size:13px; letter-spacing:2px; color:var(--gold);
  margin-bottom:8px; text-transform:uppercase}
.turn-head{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.turn-avatar{width:52px; height:52px; border-radius:50%; object-fit:cover; border:3px solid var(--pc,#fff);
  box-shadow:0 0 14px color-mix(in srgb, var(--pc,#fff) 60%, transparent)}
.turn-name{font-family:'Cinzel Decorative',serif; font-size:19px; color:var(--pc,#fff)}
.turn-msg{font-size:13px; color:var(--muted); font-weight:700; min-height:18px}
.wheel-mount{display:flex; justify-content:center; margin:6px 0 12px}
/* ---------- wheel (whole wheel rotates via transform; labels are part of it) ---------- */
.wheel{position:relative; width:100%; max-width:252px; aspect-ratio:1; container-type:inline-size}
.wheel-rotor{position:absolute; inset:0; will-change:transform;
  filter:drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.wheel-rotor svg{position:absolute; inset:0; width:100%; height:100%}
.wheel-pointer{position:absolute; top:-4px; left:50%; transform:translateX(-50%); z-index:3;
  width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent;
  border-top:22px solid var(--gold); filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.wheel-hub{position:absolute; top:50%; left:50%; width:24%; height:24%; transform:translate(-50%,-50%);
  z-index:2; border-radius:50%; background:radial-gradient(circle at 35% 30%, #44557c, #101828 70%);
  border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:24px}
.wl{position:absolute; inset:0; display:flex; justify-content:center; align-items:flex-start; pointer-events:none}
.wl span{display:flex; flex-direction:column; align-items:center; line-height:1}
.wl-num{margin-top:11cqw; font-family:'Nunito',sans-serif; font-weight:900; font-size:11cqw; color:#fff;
  text-shadow:0 .6cqw 1.2cqw rgba(0,0,0,.6), 0 0 .8cqw rgba(0,0,0,.4)}
.wl-ico{margin-top:7.5cqw; font-size:9cqw; font-style:normal; filter:drop-shadow(0 .5cqw .8cqw rgba(0,0,0,.5))}
.wl-txt{font-style:normal; font-family:'Nunito',sans-serif; font-weight:900; font-size:3.2cqw;
  letter-spacing:.15cqw; color:#fff; text-shadow:0 .3cqw .6cqw rgba(0,0,0,.7); margin-top:1.2cqw; white-space:nowrap}
/* players */
.players{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:480px){ .players{grid-template-columns:1fr} }
.pcard{--pc:#fff; background:linear-gradient(165deg,var(--panel-2),var(--panel)); border:1px solid var(--line);
  border-radius:16px; padding:12px; transition:box-shadow .25s, border-color .25s, transform .25s}
.pcard.active{border-color:var(--pc); box-shadow:0 0 0 2px var(--pc), 0 10px 26px rgba(0,0,0,.45); transform:translateY(-2px)}
.pcard.ready{border-color:#7cf3b1; box-shadow:0 0 20px rgba(124,243,177,.4)}
.pc-head{display:flex; align-items:center; gap:9px; margin-bottom:9px}
.pc-avatar{width:40px; height:40px; border-radius:50%; object-fit:cover; border:2.5px solid var(--pc)}
.pc-names b{display:block; font-size:15px; color:var(--pc)}
.pc-sub{font-size:11px; color:var(--muted); font-weight:700}
.pc-badge{margin-left:auto; font-size:10px; font-weight:900; padding:3px 7px; border-radius:20px;
  background:rgba(124,243,177,.15); color:#7cf3b1; border:1px solid rgba(124,243,177,.4); display:none}
.pcard.ready .pc-badge{display:inline-block}
.pc-skip{margin-left:auto; font-size:10px; font-weight:900; padding:3px 7px; border-radius:20px;
  background:rgba(255,93,93,.15); color:#ff8d8d; border:1px solid rgba(255,93,93,.4); display:none}
.pcard.skipping .pc-skip{display:inline-block}
.pcard.skipping.ready .pc-badge{display:none}
.pc-slots{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.slot{aspect-ratio:1; border-radius:50%; border:2px dashed rgba(255,255,255,.22); display:flex;
  align-items:center; justify-content:center; font-size:15px; color:rgba(255,255,255,.28); overflow:hidden;
  background:rgba(255,255,255,.03)}
.slot.filled{border:2px solid var(--gold); box-shadow:0 0 10px rgba(240,180,41,.35); animation:pop .4s}
.slot.filled img{width:100%; height:100%; object-fit:cover}
/* log */
.log{max-height:150px; overflow-y:auto; font-size:12.5px; display:flex; flex-direction:column; gap:6px;
  padding-right:4px}
.log div{padding:5px 8px; border-radius:8px; background:rgba(255,255,255,.045); border-left:3px solid var(--lc,#8fa3c8); font-weight:700; color:#cfdaf0}
.log div b{color:#fff}
/* ---------- overlay / modals ---------- */
.overlay{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
  background:rgba(4,7,14,.8); backdrop-filter:blur(5px); padding:14px}
.overlay.show{display:flex}
.modal{
  background:linear-gradient(165deg,#1c2745,#101828 70%); border:1px solid rgba(240,180,41,.45);
  border-radius:20px; max-width:760px; width:100%; padding:18px 22px;
  max-height:calc(100vh - 28px); overflow-y:auto;
  box-shadow:0 34px 90px rgba(0,0,0,.7); animation:pop .38s cubic-bezier(.2,1.45,.4,1);
}
@keyframes pop{0%{transform:scale(.82); opacity:0}100%{transform:scale(1); opacity:1}}
.m-title{font-family:'Cinzel Decorative',serif; font-size:clamp(17px,2.6vw,23px); color:var(--gold-2);
  text-align:center; letter-spacing:1px}
.m-sub{text-align:center; color:var(--muted); font-weight:700; font-size:12.5px; margin:3px 0 10px}
/* ---------- event modal (OK confirmation for every board action) ---------- */
.event-modal{max-width:440px; text-align:center; border-color:var(--ac,rgba(240,180,41,.45))}
.ev-icon{font-size:50px; animation:bob 2.2s ease-in-out infinite; margin-top:2px}
.ev-title{margin-top:2px; color:var(--ac,var(--gold-2))}
.ev-text{font-size:14.5px; font-weight:800; color:#cfdaf0; margin:10px 0 16px; line-height:1.55}
.ev-text b{color:#fff}
.ev-ok{max-width:240px; margin:0 auto}
/* ---------- move choice modal ---------- */
.move-modal{max-width:400px}
.move-opts{display:flex; flex-direction:column; gap:10px; max-width:300px; margin:0 auto}
/* challenge modal — compact, fits without scrollbar */
.cm-body{display:grid; grid-template-columns:180px 1fr; gap:16px; align-items:center}
@media (max-width:620px){ .cm-body{grid-template-columns:1fr} .cm-dragon{max-width:150px; margin:0 auto} }
.cm-dragon{width:100%; border-radius:50%; border:4px solid var(--gold); box-shadow:0 0 26px rgba(240,180,41,.4);
  animation:bob 3s ease-in-out infinite}
.cm-info h3{font-family:'Cinzel Decorative',serif; font-size:20px; color:#fff}
.cm-species{color:var(--gold); font-weight:900; font-size:12px; letter-spacing:1px; margin:2px 0 6px; text-transform:uppercase}
.cm-info p{font-size:13px; color:#cfdaf0; font-weight:700; margin-bottom:8px}
.cm-wheel{display:flex; justify-content:center; margin-bottom:10px}
.cm-wheel .wheel{max-width:190px}
.cm-result{margin-top:10px; text-align:center}
.cm-res{padding:10px 12px; border-radius:12px; font-weight:900; font-size:15px; margin-bottom:8px; animation:pop .35s}
.cm-res span{display:block; font-size:12px; font-weight:700; color:rgba(255,255,255,.8); margin-top:3px}
.cm-res.catch,.cm-res.catchfeast{background:rgba(47,191,113,.18); border:1px solid #2fbf71; color:#8af0b6}
.cm-res.escape{background:rgba(91,107,140,.25); border:1px solid #7d8db0; color:#cdd8ee}
.cm-res.trap{background:rgba(226,87,76,.18); border:1px solid #e2574c; color:#ffb1ab}
/* battle modal — compact */
.bm-stage{display:flex; flex-direction:column; align-items:center; gap:10px}
.bm-alpha{width:min(210px,50%); border-radius:14px; border:3px solid #9fdcff;
  box-shadow:0 0 34px rgba(120,210,255,.45); animation:alphabreathe 3.4s ease-in-out infinite}
@keyframes alphabreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.bm-alpha.hurt{animation:hurt .5s}
@keyframes hurt{0%,100%{filter:none; transform:translateX(0)}25%{filter:brightness(2) saturate(3) hue-rotate(-40deg); transform:translateX(-8px)}60%{transform:translateX(7px)}}
.bm-hp{display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:center}
.hp-block{text-align:center}
.hp-label{font-size:11px; font-weight:900; letter-spacing:1.5px; color:var(--muted)}
.pips{display:flex; gap:6px; justify-content:center; margin-top:4px}
.pip{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:14px; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25); transition:.3s}
.pip.off{opacity:.22; filter:grayscale(1); transform:scale(.8)}
.bm-vs{font-family:'Cinzel Decorative',serif; font-size:20px; color:var(--gold)}
.bm-team{font-size:12.5px; font-weight:800; color:#cfdaf0; text-align:center; line-height:1.5}
.bm-team b{color:var(--gold-2)}
.bm-wheel{width:min(195px,58%)}
.bm-roll{display:flex; align-items:center; gap:10px; font-size:11px; font-weight:900; letter-spacing:1.5px; color:var(--muted)}
.bm-roll-num{font-family:'Cinzel Decorative',serif; font-size:26px; color:#9fdcff; min-width:40px; text-align:center;
  background:rgba(159,220,255,.1); border:2px solid rgba(159,220,255,.4); border-radius:10px; padding:2px 8px}
.bm-readout{text-align:center; font-weight:800; font-size:14px; min-height:22px; color:#ffe9a8}
.bm-readout .btn{margin-top:8px}
.bm-spin{max-width:300px}
/* how to play */
.htp h4{color:var(--gold); font-size:14px; letter-spacing:1px; margin:14px 0 6px; text-transform:uppercase}
.htp ul{margin-left:18px; font-size:13.5px; color:#cfdaf0; font-weight:700; display:flex; flex-direction:column; gap:5px}
.htp li b{color:#fff}
.codex{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; margin-top:8px}
.codex .cx{background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:12px;
  padding:8px; text-align:center}
.codex img{width:64px; height:64px; border-radius:50%; border:2px solid var(--gold); object-fit:cover}
.codex b{display:block; font-size:12px; margin-top:5px}
.codex span{font-size:10.5px; color:var(--muted); font-weight:700}
/* win modal */
.win-modal{text-align:center}
.wm-crown{font-size:52px; animation:bob 2s ease-in-out infinite}
.win-modal h2{font-family:'Cinzel Decorative',serif; font-size:clamp(20px,4vw,30px); color:var(--gold-2); margin:6px 0}
.wm-avatar{width:100px; height:100px; border-radius:50%; border:4px solid var(--gold); object-fit:cover;
  box-shadow:0 0 40px rgba(240,180,41,.55)}
.wm-dragons{display:flex; gap:10px; justify-content:center; margin:14px 0; flex-wrap:wrap}
.wm-dragons img{width:70px; height:70px; border-radius:50%; border:3px solid #7cf3b1; object-fit:cover;
  box-shadow:0 0 18px rgba(124,243,177,.5); animation:pop .5s backwards}
.win-modal p{color:#cfdaf0; font-weight:700; font-size:14px; margin-bottom:14px}
.win-modal .btn{max-width:280px; margin:0 auto}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden}
.confetti i{position:absolute; width:10px; height:14px; top:-20px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>🐉 Dragon Riders of Berk</h1>
    <div class="sub">A Game-of-Life style race across the Barbaric Archipelago — tame up to 5 dragons, then defeat the Alpha!</div>
  </div>
  <div class="top-btns">
    <button class="btn ghost" id="howBtn">📜 How to Play</button>
    <button class="btn ghost" id="sndBtn">🔊 Sound</button>
    <button class="btn ghost" id="restartBtn">↻ Restart</button>
  </div>
</header>

<main class="layout">

  hiccup:'https://image.qwenlm.ai/public_source/e75c73c4-95f2-4778-8dee-b1a388d0c0f5/15546e715-599d-4ac0-93de-7020d19ca44c.png',
  astrid:'https://image.qwenlm.ai/public_source/e75c73c4-95f2-4778-8dee-b1a388d0c0f5/12adf3274-48a1-422b-8745-499e2424e8ca.png'

const DRAGONS = {
  meatlug:{name:'Meatlug', species:'Gronckle', power:2, img:IMG.meatlug},
  grump:{name:'Grump', species:'Gronckle', power:2, img:IMG.grump},

  toothless:{name:'Toothless', species:'Night Fury', power:5, img:IMG.toothless}
};
/* 6 rows x 9 columns + 5 turn connectors = 59 tiles (0..58) */
const NESTS = {5:'meatlug', 9:'grump', 15:'barf', 19:'stormfly', 24:'cloudjumper', 28:'hookfang',
               33:'toothless', 38:'stormfly', 44:'meatlug', 50:'hookfang'};
const TRAPS = [3,11,20,26,35,42,48,55];
const FEAST = [7,17,29,37,46,53];
const STORM = [13,30,43,47];
const SAFE_FLAVORS = ['Clear skies over Berk. 🕊️','A fish cart trundles past. 🐟','Seagulls steal your lunch! 🐦','Dragons soar far above the cliffs. 🐉','Warm wind from the hot springs. ♨️','Old Gobber waves hello. ⚒️','Sheep wander across the trail. 🐑','You find a shiny dragon scale. ✨'];
const ALPHA_BASE = 18, COURAGE = 6, MAX_DRAGONS = 5;

/* build the serpentine path (59 tiles) — tall square board (aspect 1.0),
   rows span 91%..9% so tiles and connectors never overlap */
const TILES = [];
(function buildPath(){
  const COLS=9, ROWS=6;
  const xs = i => 7 + i*10.75;
  const ys = r => 91 - r*16.4;
  for(let r=0;r<ROWS;r++){
    const order=[...Array(COLS).keys()];
    if(r%2===1) order.reverse();
    for(const i of order) TILES.push({x:xs(i), y:ys(r)});
    if(r<ROWS-1){
      const turnX = (r%2===0)? xs(COLS-1) : xs(0);
      const conn={x:turnX, y:(ys(r)+ys(r+1))/2};
      conn.conn=true;
      TILES.push(conn);
    }
  }
  const LASTI = TILES.length-1;
  let safeIdx=0;
  TILES.forEach((t,i)=>{
    t.i=i;
    if(i===0){ t.type='start'; }
    else if(i===LASTI){ t.type='lair'; }
    else if(NESTS[i]){ t.type='nest'; t.dragon=NESTS[i]; }
    else if(TRAPS.includes(i)){ t.type='trap'; }
    else if(FEAST.includes(i)){ t.type='feast'; }
    else if(STORM.includes(i)){ t.type='storm'; }
    else { t.type='safe'; t.flavor=SAFE_FLAVORS[safeIdx++ % SAFE_FLAVORS.length]; }
  });
})();
const LAST = TILES.length-1; /* 58 */

const MAIN_SEGS = [
  {label:'1', value:1, color:'#e2574c'},{label:'2', value:2, color:'#f6a12f'},
  {label:'3', value:3, color:'#f2d035'},{label:'4', value:4, color:'#2fbf71'},
  {label:'5', value:5, color:'#20b8ae'},{label:'6', value:6, color:'#2f6df6'},
  {label:'7', value:7, color:'#8a63d2'},{label:'8', value:8, color:'#d64f8e'},
  {label:'3', value:3, color:'#35b08a'},{label:'5', value:5, color:'#f6762f'}
];
const CHALLENGE_SEGS = [
  {icon:'🐉', text:'CATCH!', key:'catch', weight:4, color:'#2fbf71', desc:'The dragon joins your flock!'},
  {icon:'💨', text:'ESCAPES', key:'escape', weight:2, color:'#5b6b8c', desc:'It slips away — drift back 2 spaces.'},
  {icon:'🐉', text:'CATCH!', key:'catch', weight:0, color:'#26a862', desc:'The dragon joins your flock!'},
  {icon:'🪤', text:'NET TRAP', key:'trap', weight:1, color:'#e2574c', desc:'Trapper net! Lose your next turn.'},

  {icon:'💨', text:'ESCAPES', key:'escape', weight:0, color:'#6b7ba0', desc:'It slips away — drift back 2 spaces.'},
  {icon:'🐟', text:'CATCH+FEAST', key:'catchfeast', weight:1, color:'#f2d035', desc:'Caught! And a fish feast grants another spin.'},
  {icon:'🐉', text:'CATCH!', key:'catch', weight:0, color:'#26a862', desc:'The dragon joins your flock!'}

/* ============================== HELPERS ============================== */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const $ = s => document.querySelector(s);
function weightedIndex(segs){
  const tot = segs.reduce((a,s)=>a+(s.weight||1),0);
  let r = Math.random()*tot;
  for(let i=0;i<segs.length;i++){ r-=(segs[i].weight||1); if(r<0) return i; }
  return segs.length-1;
}

/* ============================== SOUND ============================== */
const Snd = {
  ctx:null, on:true,
  ac(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
        if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(f,d,type='sine',g=.12,when=0){ if(!this.on) return; const c=this.ac(); if(!c) return;
    const t=c.currentTime+when, o=c.createOscillator(), gn=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn); gn.connect(c.destination); o.start(t); o.stop(t+d); },
  tick(){ this.tone(1500,.04,'square',.045); },
  step(){ this.tone(500+Math.random()*80,.07,'triangle',.09); },
  good(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.2,'triangle',.11,i*.09)); },
  bad(){ this.tone(190,.3,'sawtooth',.09); this.tone(120,.42,'sawtooth',.08,.12); },
  clash(){ this.tone(880,.12,'square',.08); this.tone(660,.16,'square',.07,.08); },
  roar(){ if(!this.on) return; const c=this.ac(); if(!c) return;
    const dur=1.3, buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); }
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='lowpass';
    f.frequency.setValueAtTime(900,c.currentTime); f.frequency.exponentialRampToValueAtTime(110,c.currentTime+dur);
    const g=c.createGain(); g.gain.value=.4;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(); },
  win(){ [392,523,659,784,1046,1318,1568].forEach((f,i)=>this.tone(f,.32,'triangle',.12,i*.12)); }
};

/* ============================== WHEEL ==============================
   The whole wheel (wedges + number/icon labels) is one .wheel-rotor
   element rotated with a CSS transform — labels always spin with it. */
class Wheel {
  constructor(mount, segs){
    this.segs=segs; this.rot=0; this.spinning=false; this._tickT=null;
    this.el=document.createElement('div'); this.el.className='wheel';
    this.el.innerHTML='<div class="wheel-rotor"></div><div class="wheel-pointer"></div><div class="wheel-hub">🐉</div>';
    this.rotor=this.el.querySelector('.wheel-rotor');
    this.rotor.appendChild(this.buildSVG());
    const n=segs.length, segA=360/n;
    segs.forEach((s,i)=>{
      const mid=i*segA+segA/2;
      const lab=document.createElement('div');
      lab.className='wl';
      lab.style.transform=`rotate(${mid}deg)`;
      lab.innerHTML = s.icon
        ? `<span><i class="wl-ico">${s.icon}</i><em class="wl-txt">${s.text}</em></span>`
        : `<span class="wl-num">${s.label}</span>`;
      this.rotor.appendChild(lab);
    });
    mount.appendChild(this.el);
  }
  buildSVG(){ /* wedges + rim only, no text */
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 200 200');
    const n=this.segs.length, segA=360/n, cx=100, cy=100, r=98;
    this.segs.forEach((s,i)=>{
      const a0=(i*segA-90)*Math.PI/180, a1=((i+1)*segA-90)*Math.PI/180;
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',`M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`);
      p.setAttribute('fill',s.color); p.setAttribute('stroke','rgba(8,12,22,.6)'); p.setAttribute('stroke-width','1.6');
      svg.appendChild(p);
    });
    const rim=document.createElementNS(NS,'circle');
    rim.setAttribute('cx',100); rim.setAttribute('cy',100); rim.setAttribute('r',99);
    rim.setAttribute('fill','none'); rim.setAttribute('stroke','#f0b429'); rim.setAttribute('stroke-width','3');
    svg.appendChild(rim);
    return svg;
  }
  async spin(dur=4.2){
    if(this.spinning) return null;
    this.spinning=true;
    const idx=weightedIndex(this.segs);
    const n=this.segs.length, segA=360/n;
    const c=idx*segA+segA/2;
    const jitter=(Math.random()-.5)*segA*.55;
    const base=((360-c)%360+360)%360;
    const minRot=this.rot+360*4+Math.random()*160;
    const k=Math.ceil((minRot-base)/360);
    const target=base+360*k+jitter;
    this.rot=target;
    let delay=70;
    const tickLoop=()=>{ Snd.tick(); delay*=1.13; if(delay<430) this._tickT=setTimeout(tickLoop,delay); };
    tickLoop();
    this.rotor.style.transition=`transform ${dur}s cubic-bezier(.12,.72,.16,1)`;
    this.rotor.style.transform=`rotate(${target}deg)`; /* whole wheel incl. labels */
    await sleep(dur*1000+120);
    clearTimeout(this._tickT);
    this.spinning=false;
    return idx;
  }
}

const PLAYERS = [
  {id:0, name:'Hiccup', avatar:IMG.hiccup, color:'#39d98a', dragons:[], pos:0, skip:false, skipWhy:null},

/* ============================== BOARD RENDER ============================== */
const boardEl=$('#board');
function renderBoard(){
  const svg=$('#pathSvg');
  const pts=TILES.map(t=>`${(t.x/100*1550).toFixed(1)},${(t.y/100*1000).toFixed(1)}`).join(' ');
  svg.innerHTML=`<polyline points="${pts}"></polyline>`;
  const TYPE_COLOR={start:'#f0b429', nest:'#59d98c', trap:'#ff5d5d', feast:'#ffc93c', storm:'#4dd7fe', safe:'#8fa3c8', lair:'#9fdcff'};
  const TYPE_ICON={start:'🛖', trap:'🪤', feast:'🐟', storm:'🌀', safe:'✦'};
  TILES.forEach(t=>{
    if(t.type==='lair'){
      const l=document.createElement('div');
      l.className='lair'; l.style.left=(t.x+1.2)+'%'; l.style.top=t.y+'%';
      l.innerHTML=`<img src="${IMG.alpha}" alt="Alpha"><span>THE ALPHA'S LAIR</span>`;
      l.title='Reach here with at least 1 dragon to challenge the Alpha!';
      boardEl.appendChild(l);
      return;
    }
    const d=document.createElement('div');
    d.className='tile '+t.type; d.id='tile'+t.i;
    d.style.left=t.x+'%'; d.style.top=t.y+'%'; d.style.setProperty('--tc',TYPE_COLOR[t.type]);
    const numHtml = t.conn? '' : `<span class="tnum">${t.i}</span>`;
    if(t.type==='nest'){
      d.innerHTML=`<img src="${DRAGONS[t.dragon].img}" alt=""><span class="negg">🥚</span>${numHtml}`;
      d.title=`Dragon Nest: ${DRAGONS[t.dragon].name} (${DRAGONS[t.dragon].species}) — Taming Spin Challenge`;
    } else if(t.type==='start'){
      d.innerHTML=`<span class="ticon">🛖</span><span class="tlabel">BERK</span>`;
      d.title='Berk Village — start';
    } else {
      const tips={trap:"Trapper Net — lose a turn", feast:'Fish Feast — spin again', storm:'Storm Vortex — ride the wind to the next nest', safe:'Safe skies — '+ (t.flavor||'')};
      d.innerHTML=`<span class="ticon">${TYPE_ICON[t.type]}</span>${numHtml}`;
      d.title=tips[t.type];
    }
    boardEl.appendChild(d);
  });
  PLAYERS.forEach(p=>{
    const tok=document.createElement('div');
    tok.className='token'; tok.id='tok'+p.id; tok.style.setProperty('--pc',p.color);
    tok.innerHTML=`<span class="tname">${p.name}</span><div class="tin"><img src="${p.avatar}" alt=""></div>`;
    boardEl.appendChild(tok);
    placeToken(p);
  });
}
function placeToken(p){
  const t=TILES[p.pos], tok=$('#tok'+p.id);
  const ox = p.id===0? -1.7 : 1.7, oy = p.id===0? -1.4 : 1.4;
  tok.style.left=t.x+'%'; tok.style.top=t.y+'%';
  tok.style.transform=`translate(calc(-50% + ${ox}cqw), calc(-50% + ${oy}cqw))`;
}
function highlightTile(i){
  const el=$('#tile'+i); if(!el) return;
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
}

/* ============================== SIDE PANEL ============================== */
function renderPlayers(){
  const wrap=$('#players'); wrap.innerHTML='';
  PLAYERS.forEach(p=>{
    const c=document.createElement('div');
    c.className='pcard'+(p.id===current&&phase==='play'?' active':'')+(p.dragons.length>=MAX_DRAGONS?' ready':'')+(p.skip?' skipping':'');
    c.style.setProperty('--pc',p.color);
    const slots=Array.from({length:MAX_DRAGONS},(_,i)=>{
      const id=p.dragons[i];
      return id? `<div class="slot filled" title="${DRAGONS[id].name} — power ${DRAGONS[id].power}"><img src="${DRAGONS[id].img}" alt=""></div>`
               : `<div class="slot">🥚</div>`;
    }).join('');
    c.innerHTML=`
      <div class="pc-head">
        <img class="pc-avatar" src="${p.avatar}" alt="">
        <div class="pc-names"><b>${p.name}</b><span class="pc-sub">${p.dragons.length}/${MAX_DRAGONS} dragons • power ${teamPower(p)}</span></div>
        <span class="pc-badge">ALPHA-READY!</span>
        <span class="pc-skip">SKIPS NEXT</span>
      </div>
      <div class="pc-slots">${slots}</div>`;
    wrap.appendChild(c);
  });
}
function setTurnUI(){
  const p=cur();
  const av=$('#turnAvatar'); av.src=p.avatar; av.style.setProperty('--pc',p.color);
  $('#turnName').textContent=p.name+"'s Turn"; $('#turnName').style.setProperty('--pc',p.color);
  renderPlayers();
}
function msg(html){ $('#turnMsg').innerHTML=html; }
function log(html, color){
  const l=$('#log'); const d=document.createElement('div');
  d.style.setProperty('--lc', color||'#8fa3c8'); d.innerHTML=html;
  l.prepend(d);
  while(l.children.length>40) l.removeChild(l.lastChild);
}

/* ============================== MOVEMENT ============================== */
async function move(p, n){
  const dir = n>=0?1:-1;
  for(let i=0;i<Math.abs(n);i++){
    const next=Math.min(LAST, Math.max(0, p.pos+dir));
    if(next===p.pos) break;
    p.pos=next; placeToken(p); Snd.step(); highlightTile(p.pos);
    await sleep(230);
  }
  renderPlayers();
}
async function teleportTo(p, idx){
  const tok=$('#tok'+p.id);
  tok.style.transition='opacity .3s'; tok.style.opacity='0';
  await sleep(340);
  p.pos=Math.max(0, Math.min(LAST, idx)); placeToken(p);
  tok.style.transition='opacity .5s'; tok.style.opacity='1';
  renderPlayers(); highlightTile(p.pos);
  await sleep(540);
  tok.style.transition='';
}
function nextNest(pos){
  const list=Object.keys(NESTS).map(Number).sort((a,b)=>a-b);
  return list.find(n=>n>pos) ?? null;
}

/* ============================== MODALS ============================== */
const overlay=$('#overlay');
function closeModal(){ overlay.classList.remove('show'); overlay.innerHTML=''; }
/* Every board action is confirmed with an OK modal — nothing vanishes on its own */
function showEvent(icon, title, html, accent){
  return new Promise(res=>{
    overlay.innerHTML=`
      <div class="modal event-modal" style="--ac:${accent||'#f0b429'}">
        <div class="ev-icon">${icon}</div>
        <div class="m-title ev-title">${title}</div>
        <div class="ev-text">${html}</div>
        <button class="btn gold big ev-ok">OK</button>
      </div>`;
    overlay.classList.add('show');
    overlay.querySelector('.ev-ok').onclick=()=>{ closeModal(); res(); };
  });
}
/* After each spin the rider picks: forward 1 / back 1 (each costs the next
   turn) or the full wheel number for free */
function showMoveChoice(p, val){
  return new Promise(res=>{
    const atStart = p.pos===0;
    overlay.innerHTML=`
      <div class="modal event-modal move-modal" style="--ac:#f0b429">
        <div class="ev-icon">🎡</div>
        <div class="m-title ev-title">You spun ${val}!</div>
        <div class="ev-text">Choose your move, <b>${p.name}</b>:</div>
        <div class="move-opts">
          <button class="btn blue big" id="mvWheel">🎡 Go ${val} forward<small>FREE — the normal move</small></button>
          <button class="btn gold big" id="mvFwd1">🐾 Go 1 forward<small>COSTS your next turn</small></button>
          <button class="btn gold big" id="mvBack1" ${atStart?'disabled':''}>🐾 Go 1 backward<small>COSTS your next turn${atStart?' — already at Berk Village':''}</small></button>
        </div>
      </div>`;
    overlay.classList.add('show');
    overlay.querySelector('#mvWheel').onclick=()=>{ closeModal(); res(val); };
    overlay.querySelector('#mvFwd1').onclick =()=>{ closeModal(); res(1); };
    overlay.querySelector('#mvBack1').onclick=()=>{ closeModal(); res(-1); };
  });
}
function openChallenge(p, dragon){
  return new Promise(resolve=>{
    overlay.innerHTML=`
      <div class="modal">
        <div class="m-title">🥚 WILD DRAGON SIGHTED!</div>
        <div class="m-sub">A Taming Spin Challenge awaits, ${p.name}!</div>
        <div class="cm-body">
          <img class="cm-dragon" src="${dragon.img}" alt="${dragon.name}">
          <div class="cm-info">
            <h3>${dragon.name}</h3>
            <div class="cm-species">${dragon.species} • Power ${dragon.power}</div>
            <p>Spin the <b>Taming Wheel</b>. Land on CATCH to befriend ${dragon.name} (flock max: ${MAX_DRAGONS})!</p>
            <div class="cm-wheel" id="cmWheel"></div>
            <button class="btn gold big" id="cmSpin">🎡 SPIN THE TAMING WHEEL</button>
            <div class="cm-result" id="cmResult"></div>
          </div>
        </div>
      </div>`;
    overlay.classList.add('show');
    const wheel=new Wheel($('#cmWheel'), CHALLENGE_SEGS);
    const btn=$('#cmSpin'), res=$('#cmResult');
    btn.onclick=async ()=>{
      btn.disabled=true;
      const idx=await wheel.spin(3.4);
      const seg=CHALLENGE_SEGS[idx];
      (seg.key==='catch'||seg.key==='catchfeast') ? Snd.good() : Snd.bad();
      res.innerHTML=`<div class="cm-res ${seg.key}">${seg.icon} ${seg.text}<span>${seg.desc}</span></div>
        <button class="btn gold" id="cmCont">OK ➤</button>`;
      $('#cmCont').onclick=()=>{ closeModal(); resolve(seg.key); };
    };
  });
}
function animateRoll(el, finalVal){
  return new Promise(res=>{
    let n=0;
    const iv=setInterval(()=>{
      el.textContent=1+Math.floor(Math.random()*10);
      Snd.tick(); n++;
      if(n>12){ clearInterval(iv); el.textContent=finalVal; res(); }
    },65);
  });
}
function openBattle(p){
  return new Promise(resolve=>{
    const team=teamPower(p);
    let pHp=3, aHp=3;
    overlay.innerHTML=`
      <div class="modal">
        <div class="m-title">⚔️ THE ALPHA AWAKENS ⚔️</div>
        <div class="m-sub">The Glacial Tyrant, Lord of Ice, blocks the sky!</div>
        <div class="bm-stage">
          <img class="bm-alpha" id="bmAlpha" src="${IMG.alpha}" alt="The Alpha">
          <div class="bm-hp">
            <div class="hp-block"><span class="hp-label">THE ALPHA</span>
              <div class="pips" id="aPips">${'<span class="pip">🧊</span>'.repeat(3)}</div></div>
            <div class="bm-vs">VS</div>
            <div class="hp-block"><span class="hp-label">${p.name.toUpperCase()} + FLOCK</span>
              <div class="pips" id="pPips">${'<span class="pip">🔥</span>'.repeat(3)}</div></div>
          </div>
          <div class="bm-team">Each round: your spin + flock power <b>+${team}</b> + Rider's Courage <b>+${COURAGE}</b> vs Alpha spin + <b>${ALPHA_BASE}</b>. Natural <b>10</b> = ⚡ Plasma Blast (+6)! First to 3 hits wins — even a small flock <i>can</i> win, and every dragon raises your odds.</div>
          <div class="bm-wheel" id="bmWheel"></div>
          <div class="bm-roll"><span>ALPHA ROLL</span><span class="bm-roll-num" id="alphaRoll">?</span></div>
          <button class="btn gold big bm-spin" id="bmSpin">🔥 SPIN TO ATTACK</button>
          <div class="bm-readout" id="bmReadout">Ties clash with no damage. Good luck, rider!</div>
        </div>
      </div>`;
    overlay.classList.add('show');
    Snd.roar();
    const wheel=new Wheel($('#bmWheel'), BATTLE_SEGS);
    const btn=$('#bmSpin'), readout=$('#bmReadout'), rollEl=$('#alphaRoll'), alphaImg=$('#bmAlpha');
    const paintPips=()=>{
      [...$('#aPips').children].forEach((el,i)=>el.classList.toggle('off', i>=aHp));
      [...$('#pPips').children].forEach((el,i)=>el.classList.toggle('off', i>=pHp));
    };
    btn.onclick=async ()=>{
      btn.disabled=true;
      const idx=await wheel.spin(2.8);
      const pv=BATTLE_SEGS[idx].value;
      const av=1+Math.floor(Math.random()*10);
      await animateRoll(rollEl, av);
      const crit = (pv===10) ? 6 : 0;
      const pTot=team+pv+COURAGE+crit, aTot=ALPHA_BASE+av;
      let txt;
      if(pTot>aTot){ aHp--; Snd.good(); alphaImg.classList.remove('hurt'); void alphaImg.offsetWidth; alphaImg.classList.add('hurt');
        txt=`💥 <b>HIT!</b> ${team}+${pv}+${COURAGE}${crit?`+${crit} ⚡plasma blast`:''} = <b>${pTot}</b> vs ${aTot}!`; log(`💥 <b>${p.name}</b>'s flock hit the Alpha (${pTot} vs ${aTot})!`, p.color); }
      else if(aTot>pTot){ pHp--; Snd.bad();
        txt=`🧊 <b>ICE BLAST!</b> ${pTot} vs ${ALPHA_BASE}+${av} = <b>${aTot}</b>!`; log(`🧊 The Alpha blasted <b>${p.name}</b> (${aTot} vs ${pTot}).`, '#9fdcff'); }
      else { Snd.clash(); txt=`⚡ <b>CLASH!</b> ${pTot} apiece — sparks fly, no damage.`; }
      paintPips();
      if(aHp<=0){
        readout.innerHTML=`👑 <b>THE ALPHA FALLS!</b> ${p.name}'s dragons reign supreme!<br><button class="btn gold big" id="bmEnd">CLAIM VICTORY 👑</button>`;
        $('#bmEnd').onclick=()=>{ closeModal(); resolve(true); };
        return;
      }
      if(pHp<=0){
        readout.innerHTML=`😱 <b>The flock is scattered!</b><br><button class="btn gold big" id="bmEnd">OK ➤</button>`;
        $('#bmEnd').onclick=()=>{ closeModal(); resolve(false); };
        return;
      }
      readout.innerHTML=txt+`<br><button class="btn gold" id="bmNext">NEXT ROUND ➤</button>`;
      $('#bmNext').onclick=()=>{ btn.disabled=false; readout.innerHTML='Spin to attack again!'; };
    };
  });
}
function confetti(){
  const wrap=document.createElement('div'); wrap.className='confetti';
  const colors=['#f0b429','#39d98a','#4dd7fe','#ff5d5d','#8a63d2','#ffd766'];
  for(let i=0;i<90;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.4+Math.random()*2.4)+'s';
    c.style.animationDelay=(Math.random()*1.2)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    wrap.appendChild(c);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 6500);
}
function gameOver(p){
  phase='over'; Snd.win(); confetti();
  const dragons=p.dragons.map((id,i)=>`<img style="animation-delay:${.15*i}s" src="${DRAGONS[id].img}" title="${DRAGONS[id].name}">`).join('');
  overlay.innerHTML=`
    <div class="modal win-modal">
      <div class="wm-crown">👑</div>
      <h2>${p.name.toUpperCase()} IS THE ALPHA OF BERK!</h2>
      <img class="wm-avatar" src="${p.avatar}" alt="">
      <div class="wm-dragons">${dragons}</div>
      <p>With the Glacial Tyrant defeated, peace — and endless fish — return to the Barbaric Archipelago. Skål! 🍻</p>
      <button class="btn gold big" onclick="location.reload()">🐉 PLAY AGAIN</button>
    </div>`;
  overlay.classList.add('show');
  log(`👑 <b>${p.name}</b> defeated the Alpha and wins the game!`, '#f0b429');
  msg('Game over!');
}

/* ============================== TILE RESOLUTION ============================== */
async function resolveTile(p, depth=0){
  const t=TILES[p.pos];
  highlightTile(p.pos);
  switch(t.type){
    case 'safe':
      log(`<b>${p.name}</b>: ${t.flavor}`, p.color);
      await showEvent('✦','Safe Skies',`<b>${p.name}</b> — ${t.flavor}`,'#8fa3c8');
      break;
    case 'trap':
      p.skip=true; p.skipWhy='net'; renderPlayers(); Snd.bad();
      log(`🪤 <b>${p.name}</b> got caught in a trapper net — next turn lost.`, '#ff5d5d');
      await showEvent('🪤',"Trapper's Net!",`<b>${p.name}</b> is tangled in a dragon trapper's net and <b>loses the next turn</b>!`,'#ff5d5d');
      break;
    case 'feast':
      Snd.good(); extraTurn=true;
      log(`🐟 <b>${p.name}</b> found a fish feast — extra spin!`, '#ffc93c');
      await showEvent('🐟','Fish Feast!',`<b>${p.name}</b> devours a giant fish feast and is full of energy — <b>spin again</b>!`,'#ffc93c');
      break;
    case 'storm': {
      if(depth>=2){ await showEvent('🌀','Storm Fizzles',`The storm wind dies down around <b>${p.name}</b>... nothing happens.`,'#4dd7fe'); break; }
      const target=nextNest(p.pos);
      if(target==null){ await showEvent('🌀','Storm Fizzles',`The storm wind dies down around <b>${p.name}</b>... nothing happens.`,'#4dd7fe'); break; }
      Snd.roar();
      log(`🌀 A storm wind carried <b>${p.name}</b> to tile ${target}.`, '#4dd7fe');
      await showEvent('🌀','Storm Vortex!',`The howling wind scoops up <b>${p.name}</b> and carries them straight to <b>${DRAGONS[NESTS[target]].name}</b>'s nest (tile ${target})!`,'#4dd7fe');
      await move(p, target-p.pos);
      await resolveTile(p, depth+1);
      break;
    }
    case 'nest': {
      const d=DRAGONS[t.dragon];
      if(p.dragons.includes(t.dragon)){
        Snd.good(); extraTurn=true;
        log(`💚 <b>${p.name}</b> reunited with ${d.name} — extra spin!`, '#59d98c');
        await showEvent('💚','An Old Friend!',`<b>${d.name}</b> greets <b>${p.name}</b> with a happy warble. Already part of the flock — <b>spin again</b>!`,'#59d98c');
        break;
      }
      if(p.dragons.length>=MAX_DRAGONS){
        log(`${d.name} greeted <b>${p.name}</b>, whose flock is already full.`, '#59d98c');
        await showEvent('🐉','Flock Is Full!',`<b>${d.name}</b> circles <b>${p.name}</b> happily, but the flock of ${MAX_DRAGONS} is already complete. Onward!`,'#59d98c');
        break;
      }
      const key=await openChallenge(p, d);
      if(key==='catch' || key==='catchfeast'){
        p.dragons.push(t.dragon); renderPlayers(); Snd.good();
        log(`🐉 <b>${p.name}</b> tamed <b>${d.name}</b> the ${d.species}! (${p.dragons.length}/${MAX_DRAGONS})`, '#59d98c');
        if(key==='catchfeast') extraTurn=true;
      } else if(key==='escape'){
        log(`💨 ${d.name} slipped away from <b>${p.name}</b>.`, '#7d8db0');
        await move(p,-2);
        await showEvent('💨','The Dragon Escaped!',`<b>${d.name}</b> slipped through the clouds. <b>${p.name}</b> drifts back <b>2 spaces</b>.`,'#7d8db0');
      } else if(key==='trap'){
        p.skip=true; p.skipWhy='net'; renderPlayers();
        log(`🪤 <b>${p.name}</b> triggered a net while chasing ${d.name}.`, '#ff5d5d');
        await showEvent('🪤','Net Trap!',`While chasing <b>${d.name}</b>, <b>${p.name}</b> triggers a hidden net — <b>next turn lost</b>!`,'#ff5d5d');
      }
      break;
    }
    case 'lair': {
      if(p.dragons.length>=1){
        const won=await openBattle(p);
        if(won){ gameOver(p); return 'won'; }
        let lostName='';
        if(p.dragons.length){
          const ri=Math.floor(Math.random()*p.dragons.length);
          const lost=p.dragons.splice(ri,1)[0];
          lostName=DRAGONS[lost].name;
          log(`💔 <b>${p.name}</b> lost ${lostName} as the flock scattered!`, '#ff5d5d');
        }
        renderPlayers();
        Snd.bad();
        log(`🧊 The Alpha defeated <b>${p.name}</b> — sent back to the very start!`, '#9fdcff');
        await showEvent('🧊','The Alpha Wins!',
          `The flock scatters in the blizzard!${lostName?` <b>${lostName}</b> flies away into the mist.`:''} <b>${p.name}</b> is sent <b>all the way back to Berk Village</b> to start the journey anew.`,'#9fdcff');
        await teleportTo(p, 0);
      } else {
        Snd.roar();
        log(`🧊 The Alpha blasted <b>${p.name}</b> away from the lair — no dragons to fight with!`, '#9fdcff');
        await showEvent('🧊',"The Alpha's Icy Roar!",`<b>${p.name}</b> arrives with <b>no dragons</b>! The Glacial Tyrant's roar blasts them back <b>8 spaces</b>. Tame a flock first!`,'#9fdcff');
        await move(p,-8);
      }
      break;
    }
  }
}

/* ============================== TURN LOOP ============================== */
const spinBtn=$('#spinBtn');
const mainWheel=new Wheel($('#mainWheelMount'), MAIN_SEGS);
function turnHint(){
  const p=cur();
  if(p.dragons.length>=MAX_DRAGONS) msg(`⚔️ Flock complete! Reach the <b>Alpha's Lair</b>!`);
  else if(p.dragons.length>=1) msg(`🎡 Spin! ${p.dragons.length}/${MAX_DRAGONS} dragons — a bigger flock means better odds vs the Alpha`);
  else msg(`🎡 Spin the wheel! Find nests to build your flock`);
}
async function playTurn(){
  if(phase==='over') return;
  const p=cur();
  setTurnUI();
  spinBtn.disabled=true;
  if(p.skip){
    p.skip=false;
    const why=p.skipWhy||'net'; p.skipWhy=null;
    renderPlayers();
    msg(`⏳ ${p.name} sits this turn out.`);
    if(why==='choice'){
      log(`⏳ <b>${p.name}</b> sits out — the price of a 1-space move.`, '#ffb020');
      await showEvent('⏳','Turn Skipped!',`<b>${p.name}</b> paid the price of the careful 1-space move and sits this turn out.`,'#ffb020');
    } else {
      log(`🪤 <b>${p.name}</b> loses a turn in the net.`, '#ff5d5d');
      await showEvent('🪤','Turn Lost!',`<b>${p.name}</b> is still untangling from the trapper's net — this turn is skipped.`,'#ff5d5d');
    }
    return nextTurn(false);
  }
  turnHint();
  spinBtn.disabled=false;
}
spinBtn.onclick=async ()=>{
  if(phase==='over'||spinBtn.disabled) return;
  const p=cur();
  spinBtn.disabled=true; extraTurn=false;
  msg('Spinning...');
  const idx=await mainWheel.spin();
  const val=MAIN_SEGS[idx].value;
  Snd.good();
  msg(`${p.name} spins <b>${val}</b>!`);
  log(`🎡 <b>${p.name}</b> spun a ${val}.`, p.color);
  await sleep(300);
  /* rider chooses: wheel number (free) OR ±1 space (costs next turn) */
  const steps=await showMoveChoice(p, val);
  if(steps!==val){
    p.skip=true; p.skipWhy='choice'; renderPlayers();
    log(`🐾 <b>${p.name}</b> chose to move ${steps>0?'forward':'backward'} 1 — next turn is forfeit.`, p.color);
    msg(`${p.name} moves ${steps>0?'forward':'back'} 1 — next turn forfeit!`);
  } else {
    msg(`${p.name} rides forward ${val}!`);
  }
  await move(p, steps);
  const res=await resolveTile(p);
  if(phase==='over'||res==='won') return;
  nextTurn(extraTurn);
};
function nextTurn(extra){
  if(!extra) current=1-current;
  else log(`✨ <b>${cur().name}</b> takes an extra turn!`, cur().color);
  playTurn();
}

$('#howBtn').onclick=showHowTo;
renderBoard();
renderPlayers();
setTurnUI();
log('🐉 The saga begins! Tame dragons and be the first to defeat the Alpha.', '#f0b429');
showHowTo();
